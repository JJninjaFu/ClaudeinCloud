<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chew Bubblegum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Bungee&family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<style>
:root{--bg:#141312;--yellow:#f5b800;--orange:#ff6b1a;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:none}
</style>
<canvas id="c"></canvas>
<script>
'use strict';
// ============================================================
// Chew Bubblegum: Jeff, a shotgun, and expense allocation.
// One canvas, logical 1280 x 720, letterboxed to the window.
// ============================================================
const W = 1280, H = 720, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let dpr = 1, scale = 1, offX = 0, offY = 0;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  scale = Math.min(innerWidth / W, innerHeight / H);
  offX = (innerWidth - W * scale) / 2; offY = (innerHeight - H * scale) / 2;
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const INK = '#1b1a1f';
const F = {
  title: "'Bungee', Impact, 'Arial Black', sans-serif",
  comic: "'Bangers', Impact, 'Arial Black', sans-serif",
  hud: "'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif",
  mono: "'IBM Plex Mono', ui-monospace, monospace",
  body: "'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif",
};
const font = (px, fam, w = '') => `${w} ${px}px ${fam}`;
if (document.fonts && document.fonts.load) {
  ['80px Bungee', '40px Bangers', '800 40px "Big Shoulders Display"', '600 20px "IBM Plex Mono"', '700 20px "IBM Plex Sans Condensed"']
    .forEach(f => document.fonts.load(f).catch(() => {}));
}
function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function wrap(c, text, maxW) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
const money = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

// ============================================================
// Audio: everything synthesized with WebAudio
// ============================================================
let AC = null, MASTER = null, NOISE = null, muted = false;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
  try {
    AC = new A();
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6;
    MASTER = AC.createGain(); MASTER.gain.value = muted ? 0 : 0.7;
    MASTER.connect(comp); comp.connect(AC.destination);
    NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function env(g, t0, a, peak, dec) {
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + dec);
}
function sNoise(o) {
  if (!AC) return;
  const t0 = AC.currentTime + (o.when || 0), a = o.a || 0.003;
  const src = AC.createBufferSource(); src.buffer = NOISE; src.loop = true;
  const f = AC.createBiquadFilter(); f.type = o.type || 'lowpass'; f.Q.value = o.q || 0.7;
  f.frequency.setValueAtTime(o.f || 1000, t0);
  if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + a + o.d);
  const g = AC.createGain(); env(g, t0, a, o.g || 0.5, o.d);
  src.connect(f); f.connect(g); g.connect(o.out || MASTER);
  src.start(t0, Math.random() * 1.5); src.stop(t0 + a + o.d + 0.05);
}
function sTone(o) {
  if (!AC) return;
  const t0 = AC.currentTime + (o.when || 0), a = o.a || 0.004;
  const os = AC.createOscillator(); os.type = o.type || 'sine';
  os.frequency.setValueAtTime(o.f, t0);
  if (o.f2) os.frequency.exponentialRampToValueAtTime(o.f2, t0 + a + o.d);
  const g = AC.createGain(); env(g, t0, a, o.g || 0.3, o.d);
  let node = os;
  if (o.lp) { const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; os.connect(f); node = f; }
  node.connect(g); g.connect(MASTER);
  os.start(t0); os.stop(t0 + a + o.d + 0.05);
}
const SFX = {
  boom() {
    sNoise({ f: 4500, f2: 160, d: 0.5, g: 1.1 });
    sNoise({ type: 'highpass', f: 2500, d: 0.05, g: 0.6 });
    sTone({ f: 130, f2: 36, d: 0.38, g: 1.0 });
    sTone({ type: 'triangle', f: 75, f2: 30, d: 0.3, g: 0.5 });
  },
  rack() {
    sNoise({ type: 'bandpass', f: 2300, q: 4, d: 0.04, g: 0.45, when: 0.2 });
    sNoise({ type: 'bandpass', f: 1500, q: 4, d: 0.06, g: 0.45, when: 0.31 });
  },
  tink() { sTone({ f: rand(2600, 3800), d: 0.07, g: 0.06 }); },
  flutter(n = 1) {
    if (!AC) return;
    const t0 = AC.currentTime, dur = 0.5 + 0.3 * n;
    const am = AC.createGain(); am.gain.value = 0.5; am.connect(MASTER);
    const lfo = AC.createOscillator(); lfo.frequency.value = rand(14, 22);
    const lg = AC.createGain(); lg.gain.value = 0.5; lfo.connect(lg); lg.connect(am.gain);
    lfo.start(t0); lfo.stop(t0 + dur + 0.1);
    sNoise({ type: 'bandpass', f: 1800, f2: 900, q: 0.6, a: 0.03, d: dur, g: 0.35, out: am });
    sNoise({ type: 'highpass', f: 4000, a: 0.01, d: 0.12, g: 0.25 });
  },
  chaching() {
    sTone({ type: 'square', f: 900, d: 0.04, g: 0.08, lp: 3000 });
    sNoise({ type: 'highpass', f: 5000, d: 0.09, g: 0.25, when: 0.04 });
    sTone({ type: 'triangle', f: 1568, d: 0.5, g: 0.25, when: 0.09 });
    sTone({ type: 'triangle', f: 2093, d: 0.65, g: 0.22, when: 0.17 });
    sTone({ f: 3136, d: 0.5, g: 0.1, when: 0.17 });
  },
  buzz() { sTone({ type: 'sawtooth', f: 150, f2: 90, d: 0.4, g: 0.2, lp: 1800 }); sTone({ type: 'square', f: 74, d: 0.38, g: 0.1, lp: 900 }); },
  crunch() {
    for (let i = 0; i < 12; i++) sNoise({ type: 'highpass', f: rand(1500, 6000), d: rand(0.03, 0.12), g: rand(0.25, 0.6), when: i * rand(0.025, 0.05) });
    sTone({ f: 95, f2: 38, d: 0.35, g: 0.9 });
    sNoise({ f: 1200, f2: 200, d: 0.35, g: 0.7 });
  },
  clink() { for (let i = 0; i < 5; i++) sTone({ type: 'triangle', f: rand(1800, 3200), d: rand(0.05, 0.15), g: 0.12, when: i * 0.03 }); sNoise({ type: 'highpass', f: 2500, d: 0.15, g: 0.3 }); },
  clank() { sTone({ type: 'square', f: 180, f2: 120, d: 0.25, g: 0.15, lp: 1500 }); sTone({ type: 'triangle', f: 520, d: 0.35, g: 0.15 }); sNoise({ type: 'bandpass', f: 900, q: 2, d: 0.2, g: 0.4 }); },
  thud() { sTone({ f: 85, f2: 34, d: 0.35, g: 1.0 }); sNoise({ f: 600, f2: 90, d: 0.25, g: 0.7 }); },
  crack() { sNoise({ type: 'bandpass', f: rand(1100, 1700), q: 5, d: 0.025, g: 0.8 }); sNoise({ type: 'highpass', f: 3000, d: 0.015, g: 0.4, when: 0.01 }); },
  whoosh() { sNoise({ type: 'bandpass', f: 500, f2: 2600, q: 1.4, a: 0.03, d: 0.25, g: 0.4 }); },
  blip() { sTone({ type: 'square', f: rand(140, 210), d: 0.045, g: 0.05, lp: 1400 }); },
  squeak() { sTone({ f: 1700, f2: 2400, d: 0.12, g: 0.05 }); },
  drone() { sTone({ type: 'sawtooth', f: 55, f2: 41, a: 0.4, d: 3.0, g: 0.18, lp: 400 }); sTone({ type: 'sawtooth', f: 82, f2: 61, a: 0.4, d: 3.0, g: 0.1, lp: 500 }); },
  ding() { sTone({ type: 'triangle', f: 1318, d: 0.4, g: 0.22 }); sTone({ type: 'triangle', f: 1976, d: 0.6, g: 0.16, when: 0.1 }); },
  pop() { sTone({ f: 600, f2: 120, d: 0.08, g: 0.3 }); sNoise({ type: 'highpass', f: 2000, d: 0.04, g: 0.3 }); },
  sting() { [262, 330, 392, 523].forEach((f, i) => sTone({ type: 'sawtooth', f, d: 0.18, g: 0.08, lp: 2200, when: i * 0.09 })); },
};

// ============================================================
// Input
// ============================================================
const input = { mx: W / 2, my: H / 2, keys: {}, touch: false, walkL: false, walkR: false };
const touchWalk = new Map();
function toLogical(e) { return { x: (e.clientX - offX) / scale, y: (e.clientY - offY) / scale }; }
const TBTN = { L: { x: 24, y: 590, w: 110, h: 110 }, R: { x: 150, y: 590, w: 110, h: 110 } };
const inRect = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
function updWalk() { input.walkL = [...touchWalk.values()].includes('L'); input.walkR = [...touchWalk.values()].includes('R'); }
cv.addEventListener('pointerdown', e => {
  audioInit();
  const p = toLogical(e); input.touch = e.pointerType === 'touch';
  if (e.button === 2) { e.preventDefault(); return; }
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (input.touch && S.scene === 'office' && O && O.phase === 'shoot') {
    if (inRect(p, TBTN.L)) { touchWalk.set(e.pointerId, 'L'); updWalk(); return; }
    if (inRect(p, TBTN.R)) { touchWalk.set(e.pointerId, 'R'); updWalk(); return; }
  }
  input.mx = p.x; input.my = p.y;
  scenes[S.scene].press?.(p.x, p.y);
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (touchWalk.has(e.pointerId)) return;
  const p = toLogical(e); input.mx = p.x; input.my = p.y;
  scenes[S.scene].move?.(p.x, p.y);
});
const endPtr = e => {
  if (touchWalk.has(e.pointerId)) { touchWalk.delete(e.pointerId); updWalk(); return; }
  const p = toLogical(e); scenes[S.scene].release?.(p.x, p.y);
};
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.repeat) return;
  audioInit();
  input.keys[e.code] = true;
  if (e.code === 'KeyM') { muted = !muted; if (MASTER) MASTER.gain.value = muted ? 0 : 0.7; return; }
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Tab'].includes(e.code)) e.preventDefault();
  scenes[S.scene].key?.(e);
});
addEventListener('keyup', e => { input.keys[e.code] = false; });
addEventListener('blur', () => { input.keys = {}; touchWalk.clear(); updWalk(); });

// ============================================================
// Scene manager and shared effects
// ============================================================
const S = { scene: 'title', t: 0, shake: 0, fade: 0, fadeCol: '#fff', shredded: 0 };
const scenes = {};
function go(name) { S.scene = name; S.t = 0; scenes[name].enter?.(); }

// ============================================================
// Jeff (drawn from primitives, side view, facing +x before flip)
// ============================================================
const SKIN = '#f1c39a', HAIR = '#5b3a22', SHIRT = '#f6f5ef', SHIRT2 = '#dcdbd2', PANTS = '#c8a46a', PANTS2 = '#ad8b55', TIE = '#c4382b';
function limb(c, x1, y1, x2, y2, w, col) {
  c.lineCap = 'round';
  c.strokeStyle = INK; c.lineWidth = w + 6; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
  c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
}
function twoBone(sx, sy, tx, ty, l1, l2, bend) {
  const dx = tx - sx, dy = ty - sy, d = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
  const dd = clamp(d, 2, l1 + l2 - 0.5);
  const ca = clamp((l1 * l1 + dd * dd - l2 * l2) / (2 * l1 * dd), -1, 1);
  const ang = a + bend * Math.acos(ca);
  return { ex: sx + Math.cos(ang) * l1, ey: sy + Math.sin(ang) * l1, hx: sx + Math.cos(a) * dd, hy: sy + Math.sin(a) * dd };
}
function circle(c, x, y, r, fill, stroke = INK, lw = 3) {
  c.beginPath(); c.arc(x, y, r, 0, TAU); if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.strokeStyle = stroke; c.lineWidth = lw; c.stroke(); }
}
function drawGunShape(c) {
  c.lineWidth = 3; c.strokeStyle = INK; c.lineJoin = 'round';
  // stock
  c.fillStyle = '#8a5a2b';
  c.beginPath(); c.moveTo(-36, -3); c.lineTo(-4, -7); c.lineTo(-4, 6); c.lineTo(-36, 13); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#2a2a2e'; c.fillRect(-40, -4, 5, 18); c.strokeRect(-40, -4, 5, 18);
  // receiver + trigger
  c.fillStyle = '#3a3d44'; rrect(c, -5, -8, 42, 15, 3); c.fill(); c.stroke();
  c.beginPath(); c.arc(10, 9, 5, 0, Math.PI); c.stroke();
  // barrel + magazine tube
  c.fillStyle = '#2a2c31'; c.fillRect(36, -7, 92, 6); c.strokeRect(36, -7, 92, 6);
  c.fillStyle = '#34373e'; c.fillRect(36, 0, 78, 5); c.strokeRect(36, 0, 78, 5);
  // pump
  c.fillStyle = '#9b6a35'; rrect(c, 62, -2, 30, 11, 3); c.fill(); c.stroke();
  c.strokeStyle = 'rgba(27,26,31,.6)'; c.lineWidth = 1.5;
  for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(67 + i * 6, -1); c.lineTo(67 + i * 6, 8); c.stroke(); }
  c.fillStyle = '#f5b800'; c.fillRect(124, -9, 4, 3);
}
// head centered at 0,0, facing +x, radius ~30
function drawHead(c, mood = 'normal', talk = 0, t = 0) {
  c.lineWidth = 3; c.strokeStyle = INK;
  circle(c, -8, 3, 7, SKIN);
  c.fillStyle = SKIN; c.beginPath(); c.ellipse(0, 0, 30, 32, 0, 0, TAU); c.fill(); c.stroke();
  // jowl
  c.beginPath(); c.ellipse(14, 20, 15, 10, 0.2, 0, Math.PI); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(0, 0, 29, 31, 0, 0.2, 2.2); c.fill();
  // hair
  c.fillStyle = HAIR;
  c.beginPath(); c.moveTo(-30, 6); c.quadraticCurveTo(-36, -30, -2, -34); c.quadraticCurveTo(28, -35, 31, -12);
  c.quadraticCurveTo(16, -22, 6, -17); c.quadraticCurveTo(-10, -16, -14, 7); c.closePath(); c.fill(); c.stroke();
  // nose
  c.fillStyle = SKIN; c.beginPath(); c.moveTo(27, -7); c.quadraticCurveTo(42, 2, 29, 9); c.fill(); c.stroke();
  // glasses
  c.fillStyle = 'rgba(190,225,255,.55)'; rrect(c, 11, -13, 17, 13, 3); c.fill();
  c.lineWidth = 4; c.stroke();
  c.beginPath(); c.moveTo(11, -8); c.lineTo(-7, -4); c.stroke();
  // eye
  const blink = (t % 4) < 0.12;
  c.fillStyle = INK;
  if (blink) { c.lineWidth = 2.5; c.beginPath(); c.moveTo(17, -6); c.lineTo(24, -6); c.stroke(); }
  else { c.beginPath(); c.arc(21, -6, 2.8, 0, TAU); c.fill(); }
  // brow
  c.lineWidth = 5; c.lineCap = 'round'; c.beginPath();
  if (mood === 'angry') { c.moveTo(10, -22); c.lineTo(28, -15); }
  else if (mood === 'happy') { c.moveTo(10, -19); c.quadraticCurveTo(19, -24, 28, -19); }
  else { c.moveTo(10, -19); c.lineTo(28, -19); }
  c.stroke();
  // mouth
  c.lineWidth = 3;
  if (talk > 0) {
    c.fillStyle = '#6b1d1d'; c.beginPath(); c.ellipse(23, 17, 6, 3 + talk * 5, 0, 0, TAU); c.fill(); c.stroke();
  } else if (mood === 'angry') {
    c.fillStyle = '#fff'; c.fillRect(15, 14, 15, 6); c.strokeRect(15, 14, 15, 6);
    c.beginPath(); c.moveTo(20, 14); c.lineTo(20, 20); c.moveTo(25, 14); c.lineTo(25, 20); c.stroke();
  } else if (mood === 'happy') {
    c.beginPath(); c.moveTo(14, 13); c.quadraticCurveTo(23, 22, 31, 11); c.stroke();
  } else {
    c.beginPath(); c.moveTo(15, 16); c.quadraticCurveTo(22, 19, 30, 15); c.stroke();
  }
}
/* J: { x, y (feet), f (+1 right/-1 left), aL (local aim angle), ph (walk phase), moving,
        kick, pose 'stand'|'sit', gun 'aim'|'low'|'stow'|'swing', stockDir, hands 'gun'|'keys'|'knuckle',
        keyX, keyY (world), mood, talk, t } */
function drawJeff(c, J) {
  c.save(); c.translate(J.x, J.y); c.scale(J.f, 1);
  const sit = J.pose === 'sit';
  const bob = (!sit && J.moving) ? -Math.abs(Math.sin(J.ph)) * 5 : 0;
  const uy = (sit ? 16 : 0) + bob;
  const hip = { x: 0, y: -98 + uy };
  // ---- legs
  const leg = (th, col, dx) => {
    let kx, ky, fx, fy;
    if (sit) { kx = hip.x + 44 + dx; ky = hip.y + 2; fx = kx + 4; fy = -4; }
    else {
      kx = hip.x + dx + Math.sin(th) * 46; ky = hip.y + Math.cos(th) * 46;
      const sh = th + (th < 0 ? th * 0.9 : 0);
      fx = kx + Math.sin(sh) * 48; fy = Math.min(-2, ky + Math.cos(sh) * 48);
    }
    limb(c, hip.x + dx, hip.y, kx, ky, 22, col);
    limb(c, kx, ky, fx, fy, 20, col);
    c.fillStyle = '#26221f'; c.strokeStyle = INK; c.lineWidth = 3;
    c.beginPath(); c.ellipse(fx + 8, fy - 3, 15, 7, 0, 0, TAU); c.fill(); c.stroke();
  };
  const sw = J.moving ? Math.sin(J.ph) * 0.55 : 0;
  leg(sw, PANTS2, -4);
  leg(-sw, PANTS, 2);
  // ---- gun frame
  const G = { x: 6, y: -162 + uy };
  let gA = J.aL || 0, shift = 0, h1 = [4, 7], h2 = [74, 6];
  if (J.gun === 'low') gA = 0.6;
  if (J.gun === 'swing') { gA = J.stockDir + Math.PI; shift = -92; h1 = [98, -2]; h2 = [114, -2]; }
  if (J.gun === 'stow') { gA = -2.25; shift = -30; }
  const kick = J.kick || 0;
  const gl = (u, v) => {
    const cu = Math.cos(gA), su = Math.sin(gA), uu = u + shift - kick * 14;
    return [G.x + cu * uu - su * v, G.y + su * uu + cu * v];
  };
  const drawGun = () => {
    c.save(); c.translate(G.x, G.y); c.rotate(gA - kick * 0.22); c.translate(shift - kick * 14, 0);
    drawGunShape(c); c.restore();
  };
  if (J.gun === 'stow') { c.save(); c.translate(-14, 8); drawGun(); c.restore(); }
  // ---- hand targets
  let hand1, hand2;
  if (J.hands === 'keys') {
    const kx = (J.keyX - J.x) * J.f, ky = J.keyY - J.y, tt = J.t * 14;
    hand1 = [kx - 8, ky + Math.sin(tt) * 3]; hand2 = [kx + 12, ky + Math.sin(tt + 2) * 3];
  } else if (J.hands === 'knuckle') {
    const jt = Math.sin(J.t * 30) * 2;
    hand1 = [36 + jt, -146 + uy]; hand2 = [42 - jt, -142 + uy];
  } else { hand1 = gl(h1[0], h1[1]); hand2 = gl(h2[0], h2[1]); }
  // back arm
  const sb = { x: -2, y: -166 + uy }, sf = { x: 10, y: -164 + uy };
  const arm = (s, hnd, upper, fore) => {
    const k = twoBone(s.x, s.y, hnd[0], hnd[1], 38, 40, 1);
    limb(c, s.x, s.y, k.ex, k.ey, 15, upper);
    limb(c, k.ex, k.ey, k.hx, k.hy, 12, fore);
    circle(c, k.hx, k.hy, 7.5, SKIN);
  };
  arm(sb, hand1, SHIRT2, '#e0ad86');
  // ---- torso
  c.lineWidth = 3.5; c.strokeStyle = INK; c.lineJoin = 'round';

function bubble(c, text, ax, ay, opts = {}) {

}
